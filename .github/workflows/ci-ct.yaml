name: CI/CT

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install dependencies and build
        run: |
          # Retry Maven build up to 3 times if it fails
          for i in 1 2 3; do
            mvn clean install -DskipTests && break || {
              if [ $i -eq 3 ]; then
                echo "Build failed after 3 attempts"
                exit 1
              fi
              echo "Build attempt $i failed, retrying in 10 seconds..."
              sleep 10
            }
          done

      - name: Run tests
        run: xvfb-run --auto-servernum mvn test

      - name: Generate JaCoCo coverage report
        run: |
          # Generate coverage report with retry logic
          for i in 1 2 3; do
            mvn jacoco:report && break || {
              if [ $i -eq 3 ]; then
                echo "Coverage report generation failed after 3 attempts"
                exit 1
              fi
              echo "Coverage report attempt $i failed, retrying in 5 seconds..."
              sleep 5
            }
          done

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'target/site/jacoco/index.html';
            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              const coverageMatch = content.match(/Total<\/td><td class="bar">(\d+) of ([\d,]+)<\/td><td class="ctr2">(\d+%)/);
              if (coverageMatch) {
                const coverage = coverageMatch[3];
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## ✅ CI/CT Results\n\n**Test Coverage:** ${coverage}\n\nAll tests passed successfully!`
                });
              }
            }

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf target/surefire-reports/*.tmp 2>/dev/null || true
          rm -rf target/*.log 2>/dev/null || true

      - name: Notify status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ CI/CT completed successfully!"
          else
            echo "❌ CI/CT failed. Check the logs for details."
            exit 1
          fi
